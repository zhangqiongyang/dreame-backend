# 单域名 cuteyam.com：
#   /admin/     → 管理后台
#   /api/       → 后端 API
#   /uploads/   → 商品图片
#   /health     → 健康检查

# 使用 Docker 内置 DNS，避免 api 容器未就绪时 nginx 启动失败
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name cuteyam.com www.cuteyam.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name cuteyam.com www.cuteyam.com;

    root /usr/share/nginx/html;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_session_timeout 1d;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 10m;

    location /api/ {
        set $api_upstream api:8000;
        proxy_pass http://$api_upstream/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        set $api_upstream api:8000;
        proxy_pass http://$api_upstream/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        set $api_upstream api:8000;
        proxy_pass http://$api_upstream/health;
        proxy_set_header Host $host;
    }

    location = / {
        return 302 /admin/;
    }

    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }
}
