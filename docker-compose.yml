# 本地：仅 MySQL（开发）。在 dreame-backend 目录执行：docker compose up -d db
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: rootdev
      MYSQL_DATABASE: dreame
      MYSQL_USER: dreame
      MYSQL_PASSWORD: dreame
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootdev"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
